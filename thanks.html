<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clacky — you're in</title>
  <link rel="icon" href="icon.png" />
  <style>
    body { margin: 0; background: #0B0B0D; color: #F4F4F5; font: 16px/1.55 ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 560px; margin: 0 auto; padding: 80px 24px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 24px 60px rgba(110,76,255,.35); }
    h1 { font-size: 34px; letter-spacing: -.03em; margin: 24px 0 8px; }
    p { color: rgba(255,255,255,.6); }
    code { display: inline-block; margin-top: 8px; font: 600 15px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 12px 16px; user-select: all; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" />
    <h1 id="title">Thanks for buying Clacky</h1>
    <p id="auto" class="hidden">Clacky is activated. Close this tab and start typing.</p>
    <div id="manual">
      <p>Your licence key — it's also in your email. If Clacky didn't unlock by itself, open the extension, click <b>Already bought?</b> and paste it:</p>
      <code id="key"></code>
    </div>
    <p id="none" class="hidden">Purchase didn't complete. Nothing was charged — try again from the extension.</p>
  </main>
  <script>
    const q = new URLSearchParams(location.search)
    const key = (q.get('license_key') || '').split(',')[0]
    if (q.get('status') !== 'succeeded' || !key) {
      document.getElementById('manual').classList.add('hidden')
      document.getElementById('none').classList.remove('hidden')
      document.getElementById('title').textContent = 'Hmm, that didn’t go through'
    } else {
      document.getElementById('key').textContent = key
    }
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || e.data.clacky !== 'activated') return
      document.getElementById('manual').classList.add('hidden')
      document.getElementById('auto').classList.remove('hidden')
      document.getElementById('title').textContent = 'You’re all set'
    })
  </script>
</body>
</html>
